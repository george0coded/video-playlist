name: VideoPlaylist
options:
  bundleIdPrefix: dev.personal
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  VideoPlaylist:
    type: application
    platform: iOS
    sources:
      - VideoPlaylist
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Playlist
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.personal.videoplaylist
